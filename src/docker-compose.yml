services:
  zookeeper:
    image: quay.io/debezium/zookeeper:3.3
    container_name: zookeeper
    networks:
      - app-network

  kafka:
    image: quay.io/debezium/kafka:3.3
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      - ZOOKEEPER_CONNECT=zookeeper:2181
    networks:
      - app-network

  postgres:
    image: postgres:17-alpine
    container_name: postgres_container
    # logical WAL is required for Debezium CDC
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # runs on first init of the data volume only
      - ./external/postgres_example/dummy_data.sql:/docker-entrypoint-initdb.d/dummy_data.sql
    environment:
      # demo credentials, matching seeds/connectors/connector_details.json
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydatabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kafka-connect:
    image: quay.io/debezium/connect:3.3
    # the connector code addresses this host as http://connect:8083
    container_name: connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres
    environment:
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fast-api:
    build: ./external/rest_example
    container_name: fast-api-example
    ports:
      - "8000:8000"
    healthcheck:
      # the slim python image has no curl
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/day')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  docgenie-app:
    build: .
    container_name: docgenie-app
    env_file: .env
    ports:
      - "8888:8888"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      fast-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:3000/ && curl -f http://0.0.0.0:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
